[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-hunter"
version = "0.1.0"
description = "Vinted Treasure Hunter – systematische Suche nach unterschätztem Vintage- und Designer-Schmuck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "anthropic>=1.8",
]

[project.optional-dependencies]
browser = ["curl_cffi>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
vinted-hunter = "vinted_hunter.cli:main"

[tool.setuptools]
packages = ["vinted_hunter"]

[tool.setuptools.package-data]
vinted_hunter = ["wissen/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
