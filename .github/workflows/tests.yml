name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests anthropic pytest
      - run: python -m pytest -q
      - run: python -m vinted_hunter datei tests/fixtures/vinted_api_items.json --ohne-ablage
