# Suchrichtungen A–G (Abschnitt 15 der Grundprompt) und Design-DNA (Abschnitt 5).
#
# Jede Richtung enthält Suchbegriffe pro Sprache. Die Sprache ergibt sich aus der
# Vinted-Domain (de/at/lu -> de, fr/be -> fr, it -> it, nl -> nl, sonst en).
# Marken (Richtung E) und Tippfehler (Richtung F) kommen aus marken.toml.

