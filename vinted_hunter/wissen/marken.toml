# Marken- und Herstellerwissen für die Schatzsuche.
#
# Diese Datei ist bewusst editierbar: Marken ergänzen, Stufen anpassen,
# Tippfehler nachtragen. Alle Aliase werden intern normalisiert
# (Kleinschreibung, ohne Akzente, ß -> ss, ä -> a/ae), daher reicht eine Schreibweise.
#
# stufe:
#   luxus                 bekannte Luxusmarke  -> hoher Wert, aber sehr hohes Fälschungsrisiko
#   sammler               gesuchte Designer / historische Häuser -> Kernzielgruppe der Suche
#   goldschmied           Hersteller, deren Stücke praktisch immer Edelmetall sind
#   designer_modeschmuck  hochwertiger Designer-Modeschmuck, Wiederverkauf oft >= 40 €
#   neutral               bekannt, aber meist unter 40 € Wiederverkauf -> kein Bonus
#   massenware            wird sofort aussortiert (Negativfilter)
#
# aliase:     Schreibweisen, die im Text als Markennennung gelten (Wortgrenzen!)
#             Achtung bei Allerweltswörtern: "Grosse" (= große), "Weiss" (= weiß),
#             "From" usw. nur in eindeutigen Kombinationen eintragen.
# tippfehler: bekannte Falschschreibungen (Richtung F: fehlerbasierte Suche).
#             Zusätzlich erzeugt das Programm automatisch Varianten.
# suche:      false = Marke nicht aktiv suchen (nur im Text erkennen)
# suchbegriff: abweichender Text für die Vinted-Suche (Standard: name)

# ---------------------------------------------------------------------------
